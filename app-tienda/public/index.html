<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Almacén Lumen — objetos de casa</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,620&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="mast">
      <div class="mast-id">
        <p class="eyebrow">Tienda de práctica · CDMX</p>
        <h1>Almacén Lumen</h1>
        <p class="lede">Cerámica, textil, luz y escritorio. Serie corta, precios en pesos.</p>
      </div>
      <button type="button" class="cart-toggle" data-testid="cart-toggle" aria-controls="carrito">
        Carrito
        <span data-testid="cart-count">0</span>
      </button>
    </header>

    <div class="layout">
      <main>
        <div class="filtros" role="toolbar" aria-label="Categorías">
          <button type="button" class="chip is-on" data-testid="category-filter" data-category="todas" aria-pressed="true">
            Todas
          </button>
        </div>
        <p class="status" data-testid="catalog-status" data-state="loading">Cargando el catálogo…</p>
        <p class="aviso" data-testid="aviso" data-tipo="" role="alert" hidden></p>
        <section class="grid" data-testid="catalog-grid" aria-live="polite"></section>
      </main>

      <aside id="carrito" class="cart" data-testid="cart-panel">
        <h2>Tu pedido</h2>
        <p class="cart-empty" data-testid="cart-empty">Todavía no agregas piezas.</p>
        <ul class="cart-lines" data-testid="cart-lines"></ul>
        <p class="cart-total">
          Total
          <strong data-testid="cart-total" data-total="0">$0.00</strong>
        </p>
        <form class="checkout" data-testid="checkout-form" novalidate>
          <label>
            Nombre
            <input name="nombre" data-testid="checkout-nombre" autocomplete="name" required />
          </label>
          <label>
            Correo
            <input name="correo" type="email" data-testid="checkout-correo" autocomplete="email" required />
          </label>
          <button type="submit" data-testid="checkout-submit">Confirmar pedido</button>
        </form>
        <p class="folio" data-testid="order-folio" data-folio="" hidden></p>
      </aside>
    </div>

    <footer>
      <p>Los datos del catálogo son ficticios y salen de una semilla fija. No es una tienda real.</p>
    </footer>
    <script src="app.js"></script>
    <noscript>Esta tienda necesita JavaScript para consultar el catálogo.</noscript>
  </body>
</html>
